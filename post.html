---
layout: default
---

<article class="post">
  <div class="wrap">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">← All writing</a>
    <div style="margin-top:32px">
      <span class="post-meta">{{ page.date | date: "%B %d, %Y" }}{% if page.reading_time %} · {{ page.reading_time }}{% endif %}</span>
      <h1 class="title">{{ page.title }}</h1>
    </div>
    <div class="post-body">
      {{ content }}
    </div>
    <div style="margin-top:56px;padding-top:28px;border-top:1px solid var(--line)">
      <a class="back-link" href="{{ '/blog/' | relative_url }}">← Back to all writing</a>
    </div>
  </div>
</article>
